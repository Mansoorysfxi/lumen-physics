<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem('lumen-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Lumen</title>
<meta name="theme-color" content="#F5F4EF">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F5F4EF'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%231C1F23' stroke-width='4'/%3E%3Cpath d='M32 12c6 6 6 34 0 40M32 12c-6 6-6 34 0 40' fill='none' stroke='%232B50C8' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Self-contained on purpose: GitHub Pages serves this file at whatever URL was missing,
     so relative links to /assets would break. */
  :root { --bg: #F5F4EF; --ink: #1C1F23; --ink-3: #454B54; --ink-4: #5D646D; --line: #C9C7BD; --accent: #2B50C8; --screen: #121821; --btn: #1C1F23; --btn-ink: #FFFFFF; color-scheme: light; }
  [data-theme="dark"] { --bg: #121417; --ink: #ECEDEF; --ink-3: #B6BCC4; --ink-4: #9AA1AA; --line: #474D56; --accent: #8EA6FF; --screen: #0D1117; --btn: #ECEDEF; --btn-ink: #121417; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); text-align: center;
  }
  main { max-width: 520px; }
  .screen { margin: 0 auto 28px; width: 100%; max-width: 420px; background: var(--screen); border-radius: 14px; padding: 10px; }
  .screen svg { display: block; width: 100%; }
  .code { font-weight: 600; color: var(--accent); font-size: 15px; }
  h1 { font-family: "Bricolage Grotesque", Figtree, sans-serif; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; letter-spacing: -.025em; margin: 8px 0 12px; }
  p { color: var(--ink-3); margin: 0 auto 28px; line-height: 1.6; font-size: 17px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 22px; border-radius: 10px; font-weight: 600; text-decoration: none; color: var(--btn-ink); background: var(--btn); }
  a.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
  <main>
    <div class="screen" aria-hidden="true">
      <svg viewBox="0 0 400 170">
        <line x1="10" y1="85" x2="390" y2="85" stroke="#3A4452" stroke-width="1.5"/>
        <path d="M200 20 C 216 50, 216 120, 200 150 C 184 120, 184 50, 200 20 Z" fill="#6CC6E8" fill-opacity=".15" stroke="#6CC6E8" stroke-width="2"/>
        <path d="M30 60 L196 16" stroke="#F2B84B" stroke-width="2.5"/>
        <path d="M196 16 L292 -9" stroke="#F2B84B" stroke-width="2.5" stroke-dasharray="4 6"/>
        <circle cx="30" cy="60" r="5" fill="#F2B84B"/>
        <text x="236" y="40" fill="#A9B3C1" font-family="Figtree, sans-serif" font-size="14">missed it…</text>
      </svg>
    </div>
    <div class="code">Error 404</div>
    <h1>This light ray missed the lens.</h1>
    <p>The page you were looking for doesn't exist, or it hasn't been built yet. Let's get you back on the optical axis.</p>
    <div class="row"><a class="btn" id="home" href="/">Back to Lumen home</a></div>
  </main>
  <script>
    // Project sites live at username.github.io/<repo>/ – point "home" at the repo root.
    (function () {
      // Pages that moved when Lumen split into classes: send old links to their new home.
      var moved = location.pathname.replace(/\/chapter-10\//, '/class-11/chapter-10/');
      if (moved !== location.pathname && location.pathname.indexOf('/class-11/') === -1) {
        location.replace(moved + location.search + location.hash);
        return;
      }
      var seg = location.pathname.split('/')[1];
      if (/\.github\.io$/.test(location.hostname) && seg && seg.indexOf('.') === -1) {
        document.getElementById('home').href = '/' + seg + '/';
      }
    })();
  </script>
</body>
</html>
